[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tilesight"
version = "2026.07"
description = "TileSight: a tile-centric analytical GPU performance model from cores to clusters"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tilesight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
